<svg xmlns="http://www.w3.org/2000/svg" width="100%" aria-labelledby="t d" role="img" viewBox="0 0 880 500"><title id="t">One process, one thread for the VM, and four places memory lives</title><desc id="d">The host process contains a main thread and background workers. On the main thread the QuickJS VM, the snapshot it produces and GPUI&apos;s App sit in a row: a notify runs render once and fills the snapshot across a plain FFI call, and every frame after that replays the snapshot without re-entering the VM. Background workers handle timers and blocking I/O, then settle on the foreground executor without touching the VM. Memory splits four ways: the JavaScript heap capped at 256 MiB and freed by its own GC; the description arena owned by the snapshot that produced it, of which a view keeps two; the callback arena keyed by snapshot generation and retired with it; and GPUI&apos;s frame arena, which lasts exactly one draw.</desc><defs><style>@keyframes describe{0%{opacity:0;transform:translate(0,0)}8%{opacity:1;transform:translate(0,0)}28%{opacity:1;transform:translate(104px,0)}36%{opacity:0;transform:translate(104px,0)}}@keyframes replay{0%{opacity:0;transform:translate(0,0)}12%{opacity:1}88%{opacity:1;transform:translate(66px,0)}}@keyframes resolve{0%,58%{opacity:0;transform:translate(0,0)}63%{opacity:1;transform:translate(0,0)}82%{opacity:1;transform:translate(0,-94px)}90%{opacity:0;transform:translate(0,-94px)}}text{font-family:ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,monospace;font-size:11px}.h1,.h2{font-weight:650}.h1{fill:#18181b;font-size:15px}.h2,.lbl{font-size:12.5px}.lbl{fill:#18181b;font-weight:600}.note,.tag{fill:#6b7078;font-size:11px}.tag{font-size:10px;letter-spacing:.07em}.band{fill:rgba(20,20,22,.035);stroke:rgba(20,20,22,.1)}.card{fill:#fff;stroke:rgba(20,20,22,.16)}.rust{fill:#2563eb}.js{fill:#ea580c}.dash,.flow{stroke:rgba(20,20,22,.42);fill:none}.flow{stroke-width:1.4}.dash{stroke-width:1.2;stroke-dasharray:4 4;opacity:.6}.dot-js{fill:#ea580c;animation:describe 4s ease-in-out infinite}.dot-rust{fill:#2563eb;animation:replay 1.1s linear infinite}.dot-timer{fill:#6b7078;animation:resolve 4s ease-in-out infinite}@media (prefers-reduced-motion:reduce){.dot-js,.dot-rust,.dot-timer{animation:none;opacity:.9}}</style></defs><text x="16" y="22" class="h1">The host process</text><rect width="848" height="170" x="16" y="36" class="band" rx="10"/><text x="30" y="56" class="tag">MAIN THREAD</text><rect width="190" height="94" x="30" y="68" class="card" rx="8"/><text x="46" y="92" class="lbl js">QuickJS VM</text><text x="46" y="112" class="note">render() describes;</text><text x="46" y="128" class="note">handlers and tasks run here</text><text x="46" y="150" class="note mono">Rc · !Send · !Sync</text><path d="M220 108 H340" class="flow"/><circle cx="226" cy="108" r="4.5" class="dot-js"/><text x="252" y="98" class="tag">FFI</text><text x="240" y="128" class="note js">one render</text><rect width="170" height="94" x="340" y="68" class="card" rx="8"/><text x="356" y="92" class="lbl">Snapshot</text><text x="356" y="112" class="note">the finished description,</text><text x="356" y="128" class="note">frozen until the next notify</text><path d="M510 108 H600" class="flow"/><circle cx="516" cy="108" r="4.5" class="dot-rust"/><text x="524" y="128" class="note rust">every frame</text><rect width="248" height="94" x="600" y="68" class="card" rx="8"/><text x="616" y="92" class="lbl rust">GPUI App</text><text x="616" y="112" class="note">replays the snapshot, lays out, paints</text><text x="616" y="128" class="note">60 frames a second, no JavaScript</text><text x="30" y="192" class="note">cx.notify() runs render once and fills the snapshot; every frame after that replays it in Rust.</text><rect width="848" height="66" x="16" y="216" class="band" rx="10"/><text x="30" y="236" class="tag">BACKGROUND THREAD</text><rect width="118" height="30" x="30" y="244" class="card" rx="6"/><text x="89" y="263" class="note" text-anchor="middle">timers + blocking I/O</text><path d="M89 244 V162" class="dash"/><circle cx="89" cy="242" r="4" class="dot-timer"/><text x="168" y="263" class="note">timers and blocking I/O run here; results settle back on the main thread without touching the VM</text><text x="16" y="306" class="h1">Where memory lives</text><rect width="204" height="130" x="16" y="322" class="card" rx="8"/><text x="32" y="346" class="h2 js">JavaScript heap</text><text x="32" y="368" class="note">objects, closures,</text><text x="32" y="384" class="note">module scope</text><text x="32" y="408" class="note mono">cap 256 MiB</text><text x="32" y="432" class="note">freed by its own GC</text><rect width="204" height="130" x="230" y="322" class="card" rx="8"/><text x="246" y="346" class="h2 rust">description arena</text><text x="246" y="368" class="note">what render() recorded,</text><text x="246" y="384" class="note">owned by its snapshot</text><text x="246" y="408" class="note">a view keeps two:</text><text x="246" y="424" class="note">current and previous</text><rect width="204" height="130" x="444" y="322" class="card" rx="8"/><text x="460" y="346" class="h2 rust">callback arena</text><text x="460" y="368" class="note">handlers registered</text><text x="460" y="384" class="note">during that render,</text><text x="460" y="408" class="note">keyed by generation and</text><text x="460" y="424" class="note">retired with the snapshot</text><rect width="206" height="130" x="658" y="322" class="card" rx="8"/><text x="674" y="346" class="h2 rust">GPUI frame arena</text><text x="674" y="368" class="note">the real elements,</text><text x="674" y="384" class="note">built by materialize</text><text x="674" y="408" class="note">lives exactly one draw</text><text x="16" y="478" class="note">Nothing crossing the boundary is an object: an element handle is an index, retained state is a GPUI entity handle, and every argument and result is plain data.</text></svg>