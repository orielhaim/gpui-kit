<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 1200 720"><title id="title">Precise alignment in a desktop content region</title><desc id="desc">A restrained desktop layout demonstrates shared vertical edges, text baselines, and row centers. A small comparison isolates a one-rendered-pixel drift.</desc><defs><style>.canvas{fill:#0a0a0a}.frame,.surface{fill:#0a0a0a;stroke:#303030}.titlebar{fill:#171717}.table-head{fill:#1d1d1d}.muted-surface,.selected{fill:#262626}.selected{stroke:#404040}.border,.row-border{stroke:#303030}.row-border{stroke-opacity:.72}.ink,.muted{fill:#fafafa;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.muted{fill:#a3a3a3}.guide{stroke:#f87171;fill:none}.guide-text{fill:#f87171}.shadow{filter:drop-shadow(0 12px 28px rgba(0,0,0,.08))}</style><clipPath id="main-clip"><rect width="820" height="592" x="70" y="64" rx="16"/></clipPath></defs><rect width="1200" height="720" class="canvas" rx="24"/><g class="shadow"><rect width="820" height="592" x="70" y="64" class="frame" rx="16"/></g><g clip-path="url(#main-clip)"><rect width="820" height="48" x="70" y="64" class="titlebar"/><line x1="70" x2="890" y1="112" y2="112" class="border"/><circle cx="94" cy="88" r="5" fill="#ff5f57"/><circle cx="112" cy="88" r="5" fill="#febc2e"/><circle cx="130" cy="88" r="5" fill="#28c840"/><text x="118" y="164" class="ink" font-size="24" font-weight="680">Projects</text><text x="118" y="190" class="muted" font-size="14">Review current work and recent activity</text><rect width="92" height="36" x="750" y="137" class="surface" rx="9"/><text x="796" y="160" class="ink" font-size="14" font-weight="600" text-anchor="middle">Add item</text><rect width="724" height="112" x="118" y="224" class="surface" rx="12"/><text x="138" y="256" class="ink" font-size="15" font-weight="650">12 active projects</text><text x="138" y="282" class="muted" font-size="14">Four changed since your last review</text><rect width="220" height="12" x="138" y="299" class="muted-surface" rx="6"/><rect width="142" height="12" x="138" y="299" fill="#a3a3a3" rx="6"/><text x="648" y="270" class="muted" font-size="13">Updated today</text><text x="818" y="270" class="ink" font-size="16" font-weight="650" text-anchor="end">4</text><rect width="724" height="224" x="118" y="364" class="surface" rx="12"/><rect width="722" height="44" x="119" y="365" class="table-head" rx="11"/><path d="M119 396h722v13H119z" class="table-head"/><line x1="119" x2="841" y1="409" y2="409" class="border"/><text x="138" y="392" class="muted" font-size="12" font-weight="650">PROJECT</text><text x="558" y="392" class="muted" font-size="12" font-weight="650">STATUS</text><text x="696" y="392" class="muted" font-size="12" font-weight="650">UPDATED</text><text x="816" y="392" class="muted" font-size="12" font-weight="650" text-anchor="middle">MORE</text><rect width="722" height="58" x="119" y="409" stroke-width="1" class="selected"/><line x1="118" x2="842" y1="467" y2="467" class="row-border"/><line x1="118" x2="842" y1="525" y2="525" class="row-border"/><rect width="3" height="68" x="837" y="415" fill="#525252" fill-opacity=".72" rx="1.5"/><circle cx="146" cy="438" r="12" class="muted-surface"/><text x="146" y="443" class="ink" font-size="11" font-weight="700" text-anchor="middle">A</text><text x="174" y="443" class="ink" font-size="15" font-weight="620">Atlas</text><circle cx="562" cy="438" r="4" fill="#22c55e"/><text x="574" y="443" class="muted" font-size="14">Active</text><text x="696" y="443" class="muted" font-size="14">10:42</text><g fill="#a3a3a3"><circle cx="810" cy="438" r="2"/><circle cx="816" cy="438" r="2"/><circle cx="822" cy="438" r="2"/></g><circle cx="146" cy="496" r="12" class="muted-surface"/><text x="146" y="501" class="ink" font-size="11" font-weight="700" text-anchor="middle">B</text><text x="174" y="501" class="ink" font-size="15" font-weight="620">Beacon</text><circle cx="562" cy="49