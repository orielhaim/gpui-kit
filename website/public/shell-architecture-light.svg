<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="100%" aria-labelledby="t d" role="img" viewBox="0 0 880 680"><title id="t">gpui-shell: how a script becomes pixels</title><desc id="d">A loop drawn across four layers. In the JavaScript layer, render(cx) describes elements without ever holding one. Crossing the engine seam into gpui-shell, the builder calls are recorded into SpecArena, plain single-use data. materialize replays those operations into real GPUI elements in pure Rust, never calling back into the script. The elements are built from gpui-base, which ships behavior with no styling, so every color, size and gap comes from the script. GPUI lays out and paints them. An input event travels back up: the shell finds this pass&apos;s handler in CallbackArena, opens a fresh CallScope, and calls the script handler, which mutates its own state and calls cx.notify() — starting the next pass.</desc><defs><style>@keyframes stage{0%,4%{stroke:var(--accent);fill:var(--card-hi)}10%{stroke:var(--card-line);fill:var(--card)}}@keyframes stageband{0%,4%{stroke:var(--accent);fill:var(--band-hi)}10%{stroke:var(--band-line);fill:var(--band)}}@keyframes stagebandlong{0%,24%{stroke:var(--accent);fill:var(--band-hi)}30%{stroke:var(--band-line);fill:var(--band)}}:root{--band:rgba(20,20,22,.035);--band-line:rgba(20,20,22,.10);--band-hi:rgba(37,99,235,.07);--seam:rgba(20,20,22,.055);--card:#ffffff;--card-line:rgba(20,20,22,.16);--card-hi:rgba(37,99,235,.06);--ink:#18181b;--muted:#6b7078;--line:rgba(20,20,22,.42);--accent:#2563eb}text{font-family:ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif}.mono{font-family:ui-monospace,SFMono-Regular,&quot;SF Mono&quot;,Menlo,Consolas,&quot;Liberation Mono&quot;,monospace}.h1{fill:var(--ink);font-size:16px;font-weight:650}.lede{fill:var(--muted);font-size:11.5px}.layer{fill:var(--ink);font-size:12.5px;font-weight:650}.layer-sub{fill:var(--muted);font-size:11px}.seam-name{fill:var(--accent);font-size:12px;font-weight:650}.band-name,.name{fill:var(--ink);font-weight:600}.name{font-size:14px}.band-name{font-size:13px}.fact{fill:var(--ink);font-size:11.5px}.note{fill:var(--muted);font-size:11px}.claim,.edge,.tag{font-weight:600}.tag{fill:var(--muted);font-size:10.5px}.claim,.edge{fill:var(--accent);font-size:11px}.band,.card{fill:var(--band);stroke:var(--band-line);stroke-width:1}.card{fill:var(--card);stroke:var(--card-line)}.seam{fill:var(--seam)}.seam-edge{fill:none;stroke:var(--accent);stroke-width:1;stroke-dasharray:4 4;opacity:.6}.flow{fill:none;stroke:var(--line);stroke-width:1.4}.arrowhead{fill:var(--line)}.token-halo{opacity:.16}.token-core,.token-halo{fill:var(--accent)}.stage{animation:stage 7s linear infinite}.stage-band{animation:stageband 7s linear infinite}.stage-band-long{animation:stagebandlong 7s linear infinite}@media (prefers-reduced-motion:reduce){.stage,.stage-band,.stage-band-long{animation:none}.token{display:none}}</style><marker id="arrow" markerHeight="6.5" markerWidth="6.5" orient="auto" refX="9" refY="5" viewBox="0 0 10 10"><path d="M0,0 L10,5 L0,10 Z" class="arrowhead"/></marker><path id="loop" fill="none" stroke="none" d="M328,106 L328,624 Q328,638 342,638 L666,638 Q680,638 680,624 L680,106 Q680,92 666,92 L342,92 Q328,92 328,106 Z"/></defs><text x="24" y="30" class="h1">gpui-shell</text><text x="24" y="50" class="lede">A script describes elements. Rust materializes them. GPUI paints. An event starts the next pass.</text><rect width="688" height="128" x="160" y="72" class="band" rx="12"/><rect width="688" height="252" x="160" y="220" class="band" rx="12"/><rect width="688" height="68" x="160" y="492" class="band stage-band" rx="12" style="animation-delay:-5.47s"/><rect width="688" height="76" x="160" y="580" class="band stage-band-long" rx="12" style="animation-delay:-5.13s"/><text x="24" y="132" class="layer">JavaScript</text><text x="24" y="148" class="layer-sub">main.js</text><text x="24" y="342" class="layer">gpui-shell</text><text x="24" y="358" class="layer-sub">crates/shell</text><text x="24" y="522" class="layer">gpui-base</text><text x="24" y="538" class="layer-sub">behavior only</text><text x="24" y="614" class="layer">gpui</text><text x="24" y="630" class="layer-sub">rendering</text><path d="M160,232 Q160,220 172,220 L836,220 Q848,220 848,232 L848,260 L160,260 Z" class="seam"/><path d="M160,260 L848,260" class="seam-edge"/><text x="180" y="245" class="seam-name">engine seam</text><text x="278" y="245" class="note">the only Rust that knows what a script value is</text><text x="828" y="245" class="note" text-anchor="end">QuickJS, behind a cargo feature</text><path marker-end="url(#arrow)" d="M328,184 L328,278" class="flow"/><path marker-end="url(#arrow)" d="M328,350 L328,388" class="flow"/><path marker-end="url(#arrow)" d="M328,450 L328,492" class="flow"/><path marker-end="url(#arrow)" d="M328,560 L328,580" class="flow"/><text x="340" y="205" class="edge">describe</text><text x="340" y="373" class="edge">replay</text><text x="340" y="475" class="note">AnyElement</text><text x="340" y="574" class="edge">paint</text><path marker-end="url(#arrow)" d="M680,580 L680,560" class="flow"/><path marker-end="url(#arrow)" d="M680,492 L680,450" class="flow"/><path marker-end="url(#arrow)" d="M680,388 L680,350" class="flow"/><path marker-end="url(#arrow)" d="M680,278 L680,184" class="flow"/><text x="668" y="574" class="edge" text-anchor="end">event</text><text x="668" y="475" class="note" text-anchor="end">on_click fires</text><text x="668" y="373" class="note" text-anchor="end">handler lookup</text><text x="668" y="205" class="edge" text-anchor="end">fresh cx</text><path marker-end="url(#arrow)" d="M680,114 L680,106 Q680,92 666,92 L342,92 Q328,92 328,106 L328,114" class="flow"/><text x="504" y="86" class="edge" text-anchor="middle">cx.notify()</text><rect width="304" height="70" x="176" y="114" class="card stage" rx="9" style="animation-delay:0s"/><text x="196" y="137" class="name mono">render(cx)</text><text x="196" y="156" class="fact">describes elements — it never holds one</text><text x="196" y="173" class="note mono">v_flex().gap_2().bg(&quot;surface&quot;)</text><rect width="304" height="70" x="528" y="114" class="card stage" rx="9" style="animation-delay:-1.76s"/><text x="548" y="137" class="name mono">.on_click((e, cx) =&gt; …)</text><text x="548" y="156" class="fact">mutates its own state, then asks to repaint</text><text x="548" y="173" class="note mono">this.count += 1; cx.notify()</text><rect width="304" height="72" x="176" y="278" class="card stage" rx="9" style="animation-delay:-6.32s"/><text x="196" y="302" class="name mono">SpecArena</text><text x="460" y="302" class="tag" text-anchor="end">single use</text><text x="196" y="321" class="fact">plain data — no elements, no entities</text><text x="196" y="338" class="note">SpecOp: style · method · callback</text><rect width="304" height="62" x="176" y="388" class="card stage" rx="9" style="animation-delay:-5.89s"/><text x="196" y="412" class="name mono">Materialize</text><text x="196" y="431" class="fact">pure Rust — it never calls the script</text><text x="196" y="445" class="note">one pass, depth first</text><rect width="304" height="72" x="528" y="278" class="card stage" rx="9" style="animation-delay:-2.42s"/><text x="548" y="302" class="name mono">CallScope</text><text x="812" y="302" class="tag" text-anchor="end">phase: Event</text><text x="548" y="321" class="fact">a fresh cx, valid only for this call</text><text x="548" y="338" class="note">a cx kept from an earlier call throws</text><rect width="304" height="62" x="528" y="388" class="card stage" rx="9" style="animation-delay:-2.81s"/><text x="548" y="412" class="name mono">CallbackArena</text><text x="548" y="431" class="fact">CallbackId → the handler from this pass</text><text x="548" y="445" class="note">a stale id is dropped, not dispatched</text><text x="192" y="522" class="band-name">Button · Checkbox · Input · Dock</text><text x="192" y="540" class="note">behavior, focus and state — no styling at all</text><text x="832" y="530" class="claim" text-anchor="end">so every color, size and gap comes from the script</text><path d="M328,580 L328,624 Q328,638 342,638 L666,638 Q680,638 680,624 L680,580" class="flow"/><text x="192" y="602" class="band-name">layout · paint · GPU</text><text x="832" y="602" class="note" text-anchor="end">hit test · scroll · IME</text><text x="504" y="624" class="note" text-anchor="middle">the script is never on this path</text><g class="token"><circle r="9" class="token-halo"/><circle r="4" class="token-core"/><animateMotion dur="7s" repeatCount="indefinite" rotate="0"><mpath href="#loop" xlink:href="#loop"/></animateMotion></g></svg>