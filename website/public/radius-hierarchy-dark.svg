<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title desc" role="img" viewBox="0 0 960 420"><title id="title">Radius hierarchy in a chat composer</title><desc id="desc">A chat composer demonstrates three phases: the outer frame expands while the inner surface stays fixed; the inner surface expands while the outer frame stays fixed; then all layers expand together. The placeholder has equal top and left gaps, the buttons share a bottom line, and the corner arcs share their centers. Small reference shapes compare each radius with its element height.</desc><style>.canvas{fill:#0a0a0a}.button,.inner,.outer{stroke:#525252;stroke-width:1.5}.outer{fill:#171717}.inner{fill:#262626}.button{fill:#171717}.send{fill:#419cff;stroke:#419cff}.icon{fill:none;stroke:#d4d4d4;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.send-icon{stroke:#0a0a0a}.ink,.muted{fill:#fafafa;font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.muted{fill:#a3a3a3}.label{fill:#a3a3a3;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}.guide,.line{stroke-width:1}.line{stroke:#525252}.guide{fill:none;stroke:#f87171;stroke-dasharray:3 4;opacity:.7}.guide-outer{opacity:.5}#still{display:none}@media (prefers-reduced-motion:reduce){#moving{display:none}#still{display:inline}}</style><rect width="960" height="420" class="canvas" rx="20"/><text x="48" y="46" class="ink" font-size="22" font-weight="650">One composer, three radius tiers</text><text x="48" y="72" class="muted" font-size="14">Outer only, inner only, then together; alignment holds in every phase.</text><g id="moving"><rect width="528" height="232" x="48" y="112" class="outer" rx="36"><animate attributeName="x" calcMode="spline" dur="11s" keySplines="0.76 0 0.24 1;0.76 0 0.24 1;0.76 0 0.24 1;0.76 0 0.24 1;0.76 0 0.24 1;0.76 0 0.24 1;0.76 0 0.24 1;0.76 0 0.24 1;0.76 0 0.24 1" keyTimes="0;0.057142857;0.2;0.271428571;0.414285714;0.485714286;0.628571429;0.735714286;0.878571429;1" rep