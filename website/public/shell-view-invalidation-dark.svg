<svg xmlns="http://www.w3.org/2000/svg" width="100%" aria-labelledby="t d" role="img" viewBox="0 0 880 420"><title id="t">Invalidation across a window of composed views</title><desc id="d">A window drawn as nested views: a sidebar, a watchlist holding four rows that are views of their own, a chart, and a detail pane holding two more. Three phases repeat. First a price ticks and only the MSFT row is marked as running its render, while every other view is drawn from the snapshot it already has. Then the list reorders and the watchlist itself runs while its four rows do not, because a parent records one handle per child rather than the child&apos;s description. Finally the theme changes and every view runs at once, because a snapshot bakes in the colours it was built with. A frame draws the whole tree either way; what varies is how much of it re-enters the JavaScript VM.</desc><defs><style>@keyframes tint-a{0%,28%,66%{fill:#fb923c;opacity:.14}33%,61%{fill:#7daaff;opacity:.06}}@keyframes tint-b{0%,28%{fill:#7daaff;opacity:.06}33%{fill:#fb923c;opacity:.14}}@keyframes tint-c{0%,61%{fill:#7daaff;opacity:.06}66%{fill:#fb923c;opacity:.14}}@keyframes edge-a{0%,28%,66%{stroke:#fb923c}33%,61%{stroke:#7daaff}}@keyframes edge-b{0%,28%{stroke:#7daaff}33%{stroke:#fb923c}}@keyframes edge-c{0%,61%{stroke:#7daaff}66%{stroke:#fb923c}}@keyframes mark-a{0%,28%,66%{fill:#fb923c}33%,61%{fill:#7daaff}}@keyframes mark-b{0%,28%{fill:#7daaff}33%{fill:#fb923c}}@keyframes mark-c{0%,61%{fill:#7daaff}66%{fill:#fb923c}}@keyframes show-a{0%,29%{opacity:1}32%{opacity:0}}@keyframes show-b{0%,30%,65%{opacity:0}33%,62%{opacity:1}}@keyframes show-c{0%,63%{opacity:0}66%{opacity:1}}text{font-family:ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,sans-serif}.h1{fill:#e9e9ec;font-size:15px;font-weight:650}.note{fill:#9ca0a8;font-size:11.5px}.label{fill:#a1a6ad;font-size:11px;font-weight:600}.caption{fill:#9ca0a8;font-size:12px}.key{font-size:11.5px;font-weight:600}.key-js,.tint.pat-a{fill:#fb923c}.key-native{fill:#7daaff}.pane,.window{stroke:rgba(255,255,255,.2);stroke-width:1}.window{fill:rgba(255,255,255,.03)}.pane{fill:rgba(255,255,255,.05)}.tint{stroke:none;opacity:.14}.edge{fill:none;stroke-width:1.5}.mark{stroke:none}.tint.pat-a{animation:tint-a 12s linear infinite}.tint.pat-b,.tint.pat-c{fill:#7daaff;opacity:.06;animation:tint-b 12s linear infinite}.tint.pat-c{animation:tint-c 12s linear infinite}.edge.pat-a{stroke:#fb923c;animation:edge-a 12s linear infinite}.edge.pat-b,.edge.pat-c{stroke:#7daaff;animation:edge-b 12s linear infinite}.edge.pat-c{animation:edge-c 12s linear infinite}.mark.pat-a{fill:#fb923c;animation:mark-a 12s linear infinite}.mark.pat-b,.mark.pat-c{fill:#7daaff;animation:mark-b 12s linear infinite}.mark.pat-c{animation:mark-c 12s linear infinite}.show-a{opacity:1;animation:show-a 12s linear infinite}.show-b,.show-c{opacity:0}.show-b{animation:show-b 12s linear infinite}.show-c{animation:show-c 12s linear infinite}@media (prefers-reduced-motion:reduce){.edge,.mark,.show-a,.tint{animation:none}.show-a{opacity:1}.show-b,.show-c{animation:none;opacity:0}}</style></defs><text x="24" y="28" class="h1">Every view has a snapshot of its own</text><text x="24" y="48" class="note">A frame draws the whole tree. Only the view that changed runs its script again; the rest are drawn from the snapshots they already have.</text><circle cx="28" cy="74" r="4" class="key-js"/><text x="40" y="78" class="key key-js">runs its render — a new snapshot</text><circle cx="268" cy="74" r="4" class="key-native"/><text x="280" y="78" class="key key-native">drawn from the snapshot it has — no JavaScript</text><rect width="832" height="224" x="24" y="104" class="window" rx="10"/><rect width="118" height="200" x="36" y="116" class="pane" rx="8"/><rect width="118" height="200" x="36" y="116" class="tint pat-c" rx="8"/><rect width="118" height="200" x="36" y="116" class="edge pat-c" rx="8"/><circle cx="143" cy="127" r="3.5" class="mark pat-c"/><text x="45" y="132" class="label">Sidebar</text><rect width="356" height="200" x="166" y="116" class="pane" rx="8"/><rect width="356" height="200" x="166" y="116" class="tint pat-b" rx="8"/><rect width="356" height="200" x="166" y="116" class="edge pat-b" rx="8"/><circle cx="511" cy="127" r="3.5" class="mark pat-b"/><text x="175" y="132" class="label">Watchlist</text><rect width="332" height="24" x="178" y="148" class="pane" rx="5"/><rect width="332" height="24" x="178" y="148" class="tint pat-c" rx="5"/><rect width="332" height="24" x="178" y="148" class="edge pat-c" rx="5"/><circle cx="499" cy="159" r="3.5" class="mark pat-c"/><text x="187" y="164" class="label">Row · AAPL</text><rect width="332" height="24" x="178" y="178" class="pane" rx="5"/><rect width="332" height="24" x="178" y="178" class="tint pat-a" rx="5"/><rect width="332" height="24" x="178" y="178" class="edge pat-a" rx="5"/><circle cx="499" cy="189" r="3.5" class="mark pat-a"/><text x="187" y="194" class="label">Row · MSFT</text><rect width="332" height="24" x="178" y="208" class="pane" rx="5"/><rect width="332" height="24" x="178" y="208" class="tint pat-c" rx="5"/><rect width="332" height="24" x="178" y="208" class="edge pat-c" rx="5"/><circle cx="499" cy="219" r="3.5" class="mark pat-c"/><text x="187" y="224" class="label">Row · NVDA</text><rect width="332" height="24" x="178" y="238" class="pane" rx="5"/><rect width="332" height="24" x="178" y="238" class="tint pat-c" rx="5"/><rect width="332" height="24" x="178" y="238" class="edge pat-c" rx="5"/><circle cx="499" cy="249" r="3.5" class="mark pat-c"/><text x="187" y="254" class="label">Row · TSLA</text><rect width="310" height="92" x="534" y="116" class="pane" rx="8"/><rect width="310" height="92" x="534" y="116" class="tint pat-c" rx="8"/><rect width="310" height="92" x="534" y="116" class="edge pat-c" rx="8"/><circle cx="833" cy="127" r="3.5" class="mark pat-c"/><text x="543" y="132" class="label">Chart</text><rect width="310" height="96" x="534" y="220" class="pane" rx="8"/><rect width="310" height="96" x="534" y="220" class="tint pat-c" rx="8"/><rect width="310" height="96" x="534" y="220" class="edge pat-c" rx="8"/><circle cx="833" cy="231" r="3.5" class="mark pat-c"/><text x="543" y="236" class="label">Detail</text><rect width="142" height="54" x="546" y="250" class="pane" rx="5"/><rect width="142" height="54" x="546" y="250" class="tint pat-c" rx="5"/><rect width="142" height="54" x="546" y="250" class="edge pat-c" rx="5"/><circle cx="677" cy="261" r="3.5" class="mark pat-c"/><text x="555" y="266" class="label">Position</text><rect width="132" height="54" x="700" y="250" class="pane" rx="5"/><rect width="132" height="54" x="700" y="250" class="tint pat-c" rx="5"/><rect width="132" height="54" x="700" y="250" class="edge pat-c" rx="5"/><circle cx="821" cy="261" r="3.5" class="mark pat-c"/><text x="709" y="266" class="label">Orders</text><text x="24" y="368" class="caption show-a">A price ticks. Only the MSFT row runs its render again; every other view draws the frame from the snapshot it already has.</text><text x="24" y="368" class="caption show-b">The list reorders. The Watchlist runs — its rows do not: it records four handles, and each row still has its own snapshot.</text><text x="24" y="368" class="caption show-c">The theme changes. A snapshot bakes in the colours it was built with, so every view is invalidated at once. This case is the expensive one, and rare.</text><text x="24" y="408" class="note">Nesting is what keeps this cheap: a parent records one handle per child, not the child’s description.</text></svg>