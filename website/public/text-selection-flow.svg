<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" aria-labelledby="title description" role="img" viewBox="0 0 1200 560"><title id="title">Add a GPUI text-selection participant in four steps</title><description id="description">Mount the window&apos;s only TextSelectionLayer element and create stable handles, register each handle&apos;s geometry during prepaint, let GPUI Base process pointer gestures, then ask each handle for ranges to paint.</description><style>:root { color-scheme: light dark; } text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif; fill: #18202d; font-weight: 400; } .step { font-size: 19px; fill: #486ee8; } .title { font-size: 25px; } .detail { font-size: 18px; fill: #596579; } .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 17px; fill: #273248; } .tag { font-size: 15px; letter-spacing: .08em; fill: #596579; } .card { fill: #ffffff; stroke: #c9ced8; stroke-width: 1.5; rx: 16; } .base-card { fill: #eef3ff; stroke: #486ee8; stroke-width: 2; rx: 16; } .arrow { fill: none; stroke: #486ee8; stroke-width: 2.5; marker-end: url(#arrow); } @media (prefers-color-scheme: dark) { svg &gt; rect:first-of-type { fill: #17191d; } .card { fill: #22252b; stroke: #424956; } .base-card { fill: #202a45; stroke: #85a4ff; } text { fill: #eef1f6; } .step { fill: #85a4ff; } .detail, .tag { fill: #abb4c3; } .code { fill: #d9e2f5; } .arrow { stroke: #85a4ff; } #arrow path { fill: #85a4ff; } }</style><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#486ee8" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect width="1200" height="560" fill="#f7f8fa" rx="20"/><rect width="500" height="190" x="42" y="42" class="card"/><text x="72" y="78" class="step">01</text><text x="508" y="78" class="tag" text-anchor="end">APP · ONCE</text><text x="72" y="120" class="title">Set up window selection</text><text x="72" y="158" class="code">.child(TextSelectionLayer)</text><text x="72" y="192" class="code">TextSelectionHandle::new(...)</text><rect width="500" height="190" x="658" y="42" class="card"/><text x="688" y="78" class="step">02</text><text x="1128" y="78" class="tag" text-anchor="end">APP · PREPAINT</text><text x="688" y="120" class="title">Register current geometry</text><text x="688" y="158" class="code">TextSelectionHandle::register(</text><text x="714" y="192" class="code">registration, window, cx)</text><rect width="500" height="154" x="42" y="326" class="base-card"/><text x="72" y="362" class="step">03</text><text x="508" y="362" class="tag" text-anchor="end">GPUI BASE</text><text x="72" y="404" class="title">User selects text</text><text x="72" y="444" class="detail">Pointer gestures produce a snapshot.</text><rect width="500" height="222" x="658" y="292" class="card"/><text x="688" y="328" class="step">04</text><text x="1128" y="328" class="tag" text-anchor="end">APP · PAINT</text><text x="688" y="370" class="title">Project and paint</text><text x="688" y="408" class="code">TextSelectionHandle::update_runs(...)</text><text x="688" y="446" class="detail">Paint projection.ranges().</text><text x="688" y="486" class="code">TextSelection::selected_text(...)</text><path d="M542 137 H658" class="arrow"/><path d="M908 232 V260 H292 V326" class="arrow"/><path d="M542 403 H658" class="arrow"/></svg>