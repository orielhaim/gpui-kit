<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" aria-labelledby="title description" role="img" viewBox="0 0 1200 720"><title id="title">GPUI application architecture</title><description id="description">Six compact nodes form a downward dependency path from the App Shell through capability-oriented Feature Crates and GPUI Kit to GPUI.</description><defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path fill="none" stroke="#e5e5e5" d="M24 0H0V24" opacity=".52"/></pattern><filter id="shadow" width="136%" height="168%" x="-18%" y="-24%"><feDropShadow dx="0" dy="6" flood-color="#171717" flood-opacity=".1" stdDeviation="8"/></filter><filter id="signal-glow" width="700%" height="700%" x="-300%" y="-300%"><feGaussianBlur result="blur" stdDeviation="3"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes travel{0%,5%{transform:translateY(0);opacity:0}10%{opacity:1}78%{transform:translateY(392px);opacity:1}86%{transform:translateY(408px);opacity:0}}@keyframes respond{0%,16%,7%{r:5;stroke-width:1.5}10%{r:8;stroke-width:2}}@keyframes couple{0%,22%,8%{stroke-width:1.5}13%{stroke-width:2.5}}.signal{animation:travel 7s cubic-bezier(.45,0,.55,1) infinite;transform-box:view-box}.port{animation:respond 7s ease-out infinite}.p1{animation-delay:0s}.p2{animation-delay:1.03s}.p3{animation-delay:2.06s}.p4{animation-delay:3.3s}.p5{animation-delay:4.45s}.hub{animation:couple 7s ease-out 3.45s infinite}@media (prefers-reduced-motion:reduce){.hub,.port,.signal{animation:none}.signal{display:none}}</style><rect width="1200" height="720" fill="#fafafa" rx="20"/><rect width="1136" height="656" x="32" y="32" fill="url(#grid)" stroke="#e5e5e5" rx="14"/><g font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"><text x="88" y="82" fill="#737373" font-size="13" font-weight="700" letter-spacing="1.8">APPLICATION ARCHITECTURE</text><path stroke="#d4d4d4" d="M88 98H1112"/><g fill="#737373" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" letter-spacing="1.2"><text x="122" y="174">APPLICATION</text><path stroke="#a3a3a3" d="M122 186H206"/><text x="122" y="434">INTERFACE</text><path stroke="#a3a3a3" d="M122 446H206"/><text x="122" y="560">FOUNDATION</text><path stroke="#a3a3a3" d="M122 572H206"/></g><path fill="none" stroke="#d4d4d4" stroke-width="1.25" d="M224 142V372M224 410V484M224 496V644"/><path stroke="#a3a3a3" d="M216 142H232M216 372H232M216 410H232M216 484H232M216 496H232M216 644H232"/><path stroke="#a3a3a3" stroke-width="1.5" d="M600 202V610"/><circle cx="600" cy="202" r="4" fill="#171717" class="signal" filter="url(#signal-glow)"/><g filter="url(#shadow)"><rect width="408" height="76" x="396" y="126" fill="#fff" stroke="#737373" stroke-width="1.25" rx="6"/><text x="600" y="172" fill="#171717" font-size="20" font-weight="650" text-anchor="middle">App Shell</text><circle cx="600" cy="202" r="5" fill="#fafafa" stroke="#525252" stroke-width="1.5" class="port p1"/></g><g filter="url(#shadow)"><rect width="408" height="76" x="396" y="214" fill="#fff" stroke="#737373" stroke-width="1.25" rx="6"/><text x="600" y="260" fill="#171717" font-size="20" font-weight="650" text-anchor="middle">Feature Crates</text><circle cx="600" cy="290" r="5" fill="#fafafa" stroke="#525252" stroke-width="1.5" class="port p2"/></g><g filter="url(#shadow)"><rect width="408" height="76" x="396" y="302" fill="#fff" stroke="#525252" stroke-width="1.35" rx="6"/><text x="600" y="348" fill="#171717" font-size="20" font-weight="650" text-anchor="middle">App Components</text><circle cx="600" cy="378" r="5" fill="#fafafa" stroke="#525252" stroke-width="1.5" class="port p3"/></g><path stroke="#a3a3a3" stroke-dasharray="4 6" d="M88 394H1112"/><g filter="url(#shadow)"><rect width="456" height="74" x="372" y="410" fill="#f5f5f5" stroke="#525252" stroke-width="1.5" class="hub" rx="6"/><text x="600" y="454" fill="#171717" font-size="21" font-weight="700" text-anchor="middle">GPUI Kit</text><circle cx="600" cy="484" r="5" fill="#fafafa" stroke="#525252" stroke-width="1.5" class="port p4"/></g><g filter="url(#shadow)"><rect width="384" height="86" x="408" y="496" fill="#fff" stroke="#737373" stroke-width="1.35" rx="6"/><text x="600" y="546" fill="#171717" font-size="20" font-weight="650" text-anchor="middle">GPUI Base</text><circle cx="600" cy="582" r="5" fill="#fafafa" stroke="#525252" stroke-width="1.5" class="port p5"/></g><g filter="url(#shadow)"><rect width="384" height="50" x="408" y="594" fill="#fff" stroke="#737373" stroke-width="1.5" rx="6"/><text x="600" y="626" fill="#171717" font-size="20" font-weight="700" text-anchor="middle">GPUI</text></g></g></svg>