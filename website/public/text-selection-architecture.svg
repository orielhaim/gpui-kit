<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" aria-labelledby="title description" role="img" viewBox="0 0 1200 540"><title id="title">Text selection module responsibilities</title><description id="description">GPUI Base exposes one TextSelectionLayer window element and a separate TextSelection API, owns window selection state and snapshots, and projects runs through TextSelectionHandle. The application owns stable handles, reports geometry and text runs, and paints or copies projected ranges.</description><style>:root { color-scheme: light dark; } text { font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif; fill: #18202d; font-weight: 400; } .label { font-size: 21px; } .detail { font-size: 17px; fill: #596579; } .small-detail { font-size: 15px; fill: #596579; } .code-detail { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; fill: #596579; } .group-label { font-size: 17px; letter-spacing: .1em; fill: #596579; } .group { fill: none; stroke: #c9ced8; stroke-width: 1.5; stroke-dasharray: 5 6; rx: 18; } .box { fill: #ffffff; stroke: #c9ced8; stroke-width: 1.5; rx: 12; } .accent { fill: #eef3ff; stroke: #486ee8; stroke-width: 2; rx: 12; } .label-bg { fill: #f7f8fa; } .arrow { fill: none; stroke: #788397; stroke-width: 2; marker-end: url(#arrow); } .accent-arrow { fill: none; stroke: #486ee8; stroke-width: 2.25; marker-end: url(#accent-arrow); } @media (prefers-color-scheme: dark) { svg &gt; rect:first-of-type { fill: #17191d; } .group { stroke: #424956; } .box { fill: #22252b; stroke: #424956; } .accent { fill: #202a45; stroke: #85a4ff; } .label-bg { fill: #17191d; } text { fill: #eef1f6; } .detail, .small-detail, .code-detail, .group-label { fill: #abb4c3; } .arrow { stroke: #8792a6; } .accent-arrow { stroke: #85a4ff; } #arrow path { fill: #8792a6; } #accent-arrow path { fill: #85a4ff; } }</style><defs><marker id="arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#788397" d="M0 0 L10 5 L0 10 z"/></marker><marker id="accent-arrow" markerHeight="7" markerWidth="7" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#486ee8" d="M0 0 L10 5 L0 10 z"/></marker></defs><rect width="1200" height="540" fill="#f7f8fa" rx="20"/><rect width="1144" height="300" x="28" y="24" class="group"/><text x="52" y="55" class="group-label">GPUI BASE</text><rect width="220" height="86" x="55" y="82" class="box"/><text x="165" y="110" class="label" text-anchor="middle">TextSelectionLayer</text><text x="165" y="137" class="small-detail" text-anchor="middle">Only window element</text><text x="165" y="157" class="small-detail" text-anchor="middle">Pointer lifecycle</text><rect width="300" height="102" x="350" y="74" class="accent"/><text x="500" y="106" class="label" text-anchor="middle">Window state</text><text x="500" y="134" class="detail" text-anchor="middle">Anchor · Cursor · Scope</text><text x="500" y="158" class="code-detail" text-anchor="middle">TextSelection API</text><rect width="220" height="86" x="725" y="82" class="box"/><text x="835" y="116" class="label" text-anchor="middle">Events</text><text x="835" y="144" class="detail" text-anchor="middle">Snapshot · Auto-scroll</text><rect width="220" height="76" x="725" y="218" class="accent"/><text x="835" y="252" class="label" text-anchor="middle">TextSelectionHandle</text><text x="835" y="278" class="code-detail" text-anchor="middle">::update → Projection</text><path d="M275 125 H350" class="accent-arrow"/><path d="M650 125 H725" class="accent-arrow"/><path d="M835 168 V218" class="arrow"/><rect width="1144" height="158" x="28" y="354" class="group"/><text x="52" y="385" class="group-label">APP · CUSTOM RENDERER</text><rect width="220" height="72" x="55" y="412" class="box"/><text x="165" y="456" class="label" text-anchor="middle">TextSelectionHandle</text><rect width="220" height="72" x="350" y="412" class="box"/><text x="460" y="456" class="label" text-anchor="middle">Geometry</text><rect width="220" height="72" x="650" y="412" class="box"/><text x="760" y="456" class="label" text-anchor="middle">Text runs</text><rect width="200" height="72" x="945" y="412" class="box"/><text x="1045" y="456" class="label" text-anchor="middle">Paint + Copy</text><path d="M165 412 V338 H440 V176" class="accent-arrow"/><path d="M460 412 V338 H560 V176" class="accent-arrow"/><rect width="490" height="24" x="120" y="326" class="label-bg" rx="5"/><text x="365" y="344" class="code-detail" text-anchor="middle">TextSelectionHandle::register(registration, window, cx)</text><path d="M835 168 C1040 190 1110 300 275 448" class="accent-arrow"/><text x="1020" y="198" class="detail" text-anchor="middle">subscribe</text><path d="M760 412 V330 H835 V294" class="arrow"/><path d="M945 256 H1045 V412" class="accent-arrow"/></svg>